name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "workflow_dispatch" ] || [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Kazun-Editor-${VERSION}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "Kazun Editor $TAG" \
            --notes "## Kazun Editor $TAG

            Free, offline, open-source Android video editor.

            ### Install
            1. Download \`Kazun-Editor-*.apk\` below
            2. Allow **Install unknown apps** when prompted
            3. Open and start editing

            > Alpha build: uninstall any previous build before installing this one.

            ### What is in this build
            - Project dashboard, 16:9 / 9:16 / 1:1 / 4:5
            - Multi-track timeline: drag, trim, split, zoom, snap-free seeking
            - 1,256 effect catalog with search + auto-generated parameter UI
            - Text overlays
            - MP4 export (stream copy, no re-encode)
            - 100% offline, zero telemetry, no network permission
            "
