name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build + test
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ $STATUS -ne 0 ]; then
            grep -n -A8 -E "^e: |error:|FAILURE:|What went wrong|Execution failed|FAILED$|OutOfMemory" build.log | head -300 > err.txt
            if [ ! -s err.txt ]; then tail -120 build.log > err.txt; fi
          fi
          exit $STATUS

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --state open --json number -q '.[0].number' | head -1)
          if [ -n "$PR" ] && [ -f err.txt ]; then
            { echo "### Release build failed"; echo '```'; cat err.txt; echo '```'; } > comment.md
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Prepare dist
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Kazun-Editor-${VERSION}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "Kazun Editor $TAG" \
            --notes "Free, offline, open-source Android video editor.

          ### Install
          1. Download the APK below
          2. Allow 'Install unknown apps' when prompted
          3. Open and start editing

          ### In this alpha
          - Project dashboard (16:9, 9:16, 1:1, 4:5)
          - Multi-track timeline: drag, trim, split, zoom
          - 1,256 effect catalog with search and parameter controls
          - Text overlays
          - MP4 export (stream copy)
          - 100% offline, no internet permission, zero telemetry

          > Uninstall any previous alpha before installing this build.
          "
